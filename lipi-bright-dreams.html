<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lipi's Bright Dreams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#cfe8ee; --paper:#fbfdf7; --ink:#1c2b33; --muted:#52646d; --line:#b9d6dd;
  --river:#0e4d64; --paddy:#1c7c54; --marigold:#f6b400; --hibiscus:#d62839; --on-hib:#ffffff;
  --stitch:#e0a100; --hl:#ffe7a0; --vtint:#d7f0dc; --vline:#1c7c54;
  --ok:#17693f; --ok-bg:#d9f2e2; --no:#a4161f; --no-bg:#fde3e5;
  --shadow:0 18px 40px rgba(14,77,100,.22);
  --fs:1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1a23; --paper:#132833; --ink:#e8f1ee; --muted:#a3b8bf; --line:#27475a;
    --river:#8fd6ea; --paddy:#63cf95; --marigold:#ffc933; --hibiscus:#ff7d8b; --on-hib:#2a0a10;
    --stitch:#c99a1c; --hl:#5c4b12; --vtint:#1c4a36; --vline:#63cf95;
    --ok:#7fe0a6; --ok-bg:#173a2a; --no:#ff9aa4; --no-bg:#43202a;
    --shadow:0 18px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1a23; --paper:#132833; --ink:#e8f1ee; --muted:#a3b8bf; --line:#27475a;
  --river:#8fd6ea; --paddy:#63cf95; --marigold:#ffc933; --hibiscus:#ff7d8b; --on-hib:#2a0a10;
  --stitch:#c99a1c; --hl:#5c4b12; --vtint:#1c4a36; --vline:#63cf95;
  --ok:#7fe0a6; --ok-bg:#173a2a; --no:#ff9aa4; --no-bg:#43202a;
  --shadow:0 18px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font-family:'Andika','Hind Siliguri','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-text-size-adjust:100%;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
.bn{font-family:'Baloo Da 2','Hind Siliguri','Noto Sans Bengali','Kalpurush','Nirmala UI',sans-serif}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:8px;padding:8px 14px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-family:'Baloo Da 2','Trebuchet MS',sans-serif;font-weight:700;font-size:1.15rem;color:var(--river)}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand svg{flex:none}
.ib{
  min-width:42px;height:42px;padding:0 10px;border-radius:12px;border:2px solid var(--line);
  background:var(--paper);color:var(--river);font-family:'Baloo Da 2',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;
}
.ib:hover{border-color:var(--river)}

/* ---------- stage ---------- */
.stagewrap{position:relative;flex:1;min-height:0;display:flex}
.stage{flex:1;overflow-y:auto;padding:10px 14px 22px;-webkit-overflow-scrolling:touch}

.page{
  position:relative;isolation:isolate;max-width:1040px;margin:0 auto;
  background:var(--paper);border-radius:8px;box-shadow:var(--shadow);
  padding:34px;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:44px;align-items:center;
  animation:turnIn .38s cubic-bezier(.2,.7,.2,1) both;
}
.page.back{animation-name:turnBack}
.page::after{ /* kantha running-stitch margin */
  content:"";position:absolute;inset:11px;border:2px dashed var(--stitch);border-radius:5px;pointer-events:none;opacity:.8;
}
.page::before{ /* book gutter */
  content:"";position:absolute;z-index:-1;top:0;bottom:0;left:calc(56% - 18px);width:36px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(14,77,100,.09) 50%,transparent);
}
.page.solo{display:block;max-width:820px}
.page.solo::before{display:none}
@keyframes turnIn{from{opacity:0;transform:translateX(26px) rotate(.4deg)}to{opacity:1;transform:none}}
@keyframes turnBack{from{opacity:0;transform:translateX(-26px) rotate(-.4deg)}to{opacity:1;transform:none}}

.art{position:relative}
.art::before{ /* pasted-in picture tape */
  content:"";position:absolute;z-index:1;top:-10px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(-3deg);
  background:rgba(246,180,0,.6);border-radius:2px;
}
.art svg{display:block;width:100%;height:auto;border-radius:4px;border:4px solid #fff;box-shadow:0 8px 20px rgba(14,77,100,.22);transform:rotate(-1deg)}

.text{min-width:0}
.titlerow{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.chno{
  flex:none;width:46px;height:46px;border-radius:50%;border:2.5px dashed var(--stitch);
  display:grid;place-items:center;font-family:'Baloo Da 2',sans-serif;font-weight:800;font-size:1.3rem;color:var(--river);
}
h1,h2{font-family:'Baloo Da 2','Trebuchet MS',sans-serif;color:var(--river);margin:0;line-height:1.1;font-weight:700}
h2{font-size:clamp(1.7rem,3.6vw,2.3rem)}
h1{font-size:clamp(2.6rem,7vw,4.4rem);font-weight:800;line-height:1}
.body{font-size:calc(1.2rem * var(--fs));line-height:1.95;margin:14px 0 18px;max-width:34em}
.sent{padding:1px 2px;border-radius:6px;cursor:pointer;transition:background .2s}
.sent:hover{background:var(--hl)}
.sent.reading{background:var(--hl);box-shadow:0 0 0 3px var(--hl)}
.vocab{
  font:inherit;color:inherit;cursor:help;border:0;border-bottom:3px solid var(--vline);border-radius:3px 3px 0 0;
  background:var(--vtint);padding:0 3px;
}
.vocab:hover{filter:brightness(.96)}
.hint{color:var(--muted);font-size:.92rem;line-height:1.6;margin:14px 0 0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Baloo Da 2','Trebuchet MS',sans-serif;font-weight:700;font-size:1.05rem;line-height:1;
  padding:.8em 1.25em;border-radius:12px;border:2px solid var(--hibiscus);
  background:var(--hibiscus);color:var(--on-hib);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.ghost{background:transparent;color:var(--river);border-color:var(--river);box-shadow:none}
.btn.big{font-size:1.25rem;padding:.85em 1.5em}

/* cover */
.cover .bnsub{font-size:1.5rem;color:var(--paddy);margin:8px 0 0;font-weight:600}
.cover .lead{font-size:1.15rem;line-height:1.7;margin:16px 0 20px;max-width:26em}
.feat{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 24px;padding:0;list-style:none}
.feat li{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--stitch);border-radius:10px;padding:6px 12px;font-size:.95rem}

/* solo pages */
.solo h2{margin-bottom:6px}
.lead{color:var(--muted);line-height:1.6;margin:0 0 20px}
.fcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.fc{position:relative;height:158px;perspective:800px;cursor:pointer}
.fc .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.fc.flipped .in{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;
}
.face.front{background:var(--river);color:var(--paper);border:2px solid var(--river)}
.face.front .w{font-family:'Baloo Da 2',sans-serif;font-weight:700;font-size:1.3rem;line-height:1.1}
.face.back{transform:rotateY(180deg);background:var(--paper);border:2px dashed var(--stitch)}
.face.back .bnw{font-size:1.4rem;font-weight:700;color:var(--paddy);line-height:1.2}
.face.back .df{font-size:.82rem;line-height:1.45;color:var(--ink)}
.spk{border:2px solid currentColor;background:transparent;border-radius:999px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center;padding:0}
.spk svg{display:block}
.face.front .spk{color:var(--marigold)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;color:var(--muted);font-size:.95rem}
.qbar{display:flex;gap:6px;margin-bottom:18px}
.qbar i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.qbar i.on{background:var(--paddy)}
.qbar i.cur{background:var(--marigold)}
.qtext{font-family:'Baloo Da 2',sans-serif;font-weight:600;font-size:clamp(1.25rem,3vw,1.6rem);line-height:1.3;color:var(--ink);margin:0 0 16px}
.opts{display:grid;gap:10px;margin-bottom:16px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;cursor:pointer;
  border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font-size:1.08rem;
}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--river);color:var(--river);font-family:'Baloo Da 2',sans-serif}
.opt:hover:not(:disabled){border-color:var(--river)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.correct b{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{background:var(--no-bg);border-color:var(--no)}
.opt.wrong b{background:var(--no);border-color:var(--no);color:var(--paper)}
.fb{border-radius:12px;padding:12px 14px;line-height:1.6;margin-bottom:16px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--no-bg);color:var(--no)}
.fb strong{font-family:'Baloo Da 2',sans-serif}
.score{text-align:center;padding:10px 0 6px}
.stars{font-size:2.2rem;letter-spacing:.1em;color:var(--marigold);margin:4px 0}
.stars .off{color:var(--line)}
.bigscore{font-family:'Baloo Da 2',sans-serif;font-weight:800;font-size:3rem;color:var(--river);line-height:1}

/* order game */
.ocards{display:grid;gap:10px;margin-bottom:16px}
.ocard{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;cursor:pointer;
  border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font-size:1.05rem;line-height:1.4;
}
.ocard .badge{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--stitch);font-family:'Baloo Da 2',sans-serif;font-weight:700;color:var(--muted)}
.ocard:hover:not(:disabled){border-color:var(--river)}
.ocard.placed{background:var(--ok-bg);border-color:var(--ok);cursor:default}
.ocard.placed .badge{background:var(--ok);border:2px solid var(--ok);color:var(--paper)}
.ocard:disabled{color:var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* end page */
.page.end{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}
.page.end::before{left:calc(50% - 18px)}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.fact{border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.95rem}
.fact b{font-family:'Baloo Da 2',sans-serif;color:var(--river)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:.4em .95em;cursor:pointer;font-size:.98rem}
.chip[aria-pressed="true"]{background:var(--paddy);border-color:var(--paddy);color:var(--paper)}
.chip:hover{border-color:var(--river)}
.pledgemsg{min-height:1.6em;color:var(--ok);font-weight:700;margin:2px 0 14px}
.dcard{
  position:relative;background:var(--marigold);color:#2b1f00;border-radius:10px;padding:26px 20px;text-align:center;
  box-shadow:0 10px 24px rgba(0,0,0,.18);margin-bottom:16px;
}
.dcard::after{content:"";position:absolute;inset:8px;border:2px dashed #2b1f00;border-radius:6px;opacity:.55;pointer-events:none}
.dcard .t{font-family:'Baloo Da 2',sans-serif;font-weight:700;font-size:1.05rem}
.dcard .nm{font-family:'Baloo Da 2',sans-serif;font-weight:800;font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.1;margin:6px 0;overflow-wrap:anywhere}
.dcard .goal{font-family:'Baloo Da 2',sans-serif;font-weight:700;font-size:1.5rem;line-height:1.2;margin:4px 0 10px;overflow-wrap:anywhere}
.dcard .sm{font-size:.92rem;line-height:1.5}
.field{display:block;margin-bottom:12px;font-size:.95rem;color:var(--muted)}
.field input{
  display:block;width:100%;margin-top:4px;padding:.65em .8em;border-radius:10px;border:2px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:1.05rem;
}
.field input:focus{border-color:var(--river);outline:none}

/* meaning popover */
.def{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;width:min(92%,440px);
  background:var(--river);color:var(--paper);border-radius:14px;padding:14px 16px 16px;box-shadow:0 14px 34px rgba(0,0,0,.35);display:none;
}
.def.open{display:block;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%)}}
.def .dh{display:flex;align-items:center;gap:10px}
.def .dw{font-family:'Baloo Da 2',sans-serif;font-weight:800;font-size:1.5rem;line-height:1}
.def .dbn{font-size:1.25rem;color:var(--marigold);font-weight:600;margin:6px 0 2px}
.def p{margin:0;line-height:1.55;font-size:.98rem}
.def .spk{color:var(--marigold);width:36px;height:36px}
.def .x{margin-left:auto;border:0;background:transparent;color:var(--paper);font-size:1.6rem;line-height:1;cursor:pointer;width:36px;height:36px;border-radius:8px}

/* footer nav */
.nav{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--paper);border-top:2px dashed var(--stitch)}
.prog{flex:1;min-width:0;text-align:center}
.pl{font-size:.85rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--paddy);border-radius:99px;transition:width .35s}
.nav .btn{padding:.7em 1em}

/* contents overlay */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(6,20,28,.55);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.overlay.open{display:flex}
.panel{width:min(100%,460px);max-height:100%;overflow:auto;background:var(--paper);border-radius:10px;padding:18px;box-shadow:var(--shadow)}
.panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.panel h3{margin:0;font-family:'Baloo Da 2',sans-serif;font-size:1.5rem;color:var(--river)}
.panel ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ti{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:1.02rem}
.ti:hover{background:var(--vtint)}
.ti.cur{border-color:var(--marigold)}
.ti .n{flex:none;width:32px;height:32px;border-radius:50%;border:2px dashed var(--stitch);display:grid;place-items:center;font-family:'Baloo Da 2',sans-serif;font-weight:700;color:var(--river)}

@media (max-width:820px){
  .stage{padding:8px 10px 18px}
  .page{grid-template-columns:1fr;gap:26px;padding:30px 26px}
  .page::before{display:none}
  .page.end{grid-template-columns:1fr}
  .brand{font-size:1rem}
  .nav .btn .lb{display:none}
  .nav .btn{padding:.7em .9em}
}
@media (prefers-reduced-motion:reduce){
  .page,.page.back,.def.open,.shake{animation:none}
  .fc .in,.bar i{transition:none}
}
</style>
</head>
<body>

<!-- shared drawing parts -->

<defs>
  <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc6f0"/><stop offset="1" stop-color="#e2f5ff"/></linearGradient>

  </symbol>

  <!-- standing person -->
  <symbol id="person" viewBox="0 0 60 122">
    <circle cx="30" cy="10" r="6.5" style="fill:var(--hair,#1d1a1f);opacity:var(--bun,0)"/>
    <rect x="21" y="92" width="7" height="24" rx="3" style="fill:var(--skin,#c68a5b)"/>
    <rect x="32" y="92" width="7" height="24" rx="3" style="fill:var(--skin,#c68a5b)"/>
    <ellipse cx="24" cy="118" rx="7" ry="3.5" fill="#333"/><ellipse cx="36" cy="118" rx="7" ry="3.5" fill="#333"/>
    <path d="M19 62 L41 62 L44 102 L16 102 Z" style="fill:var(--bottom,#3d5a80)"/>

    <path d="M19 42 L12 70" stroke-width="7" stroke-linecap="round" style="stroke:var(--skin,#c68a5b)"/>
    <path d="M41 42 L48 70" stroke-width="7" stroke-linecap="round" style="stroke:var(--skin,#c68a5b)"/>
    <circle cx="30" cy="24" r="12" style="fill:var(--skin,#c68a5b)"/>

    <circle cx="26" cy="25" r="1.4" fill="#2b2d42"/><circle cx="34" cy="25" r="1.4" fill="#2b2d42"/>

/* ============================================================

   ============================================================ */
let speechToken = 0;
function clearHL(){ document.querySelectorAll('.sent.reading').forEach(e => e.classList.remove('reading')); }
function setListening(on){
  const b = $('.listen'); if(!b) return;
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.querySelector('.lbl').textContent = on ? 'Stop reading' : 'Read aloud';
}
function stopSpeech(){
  speechToken++;
  if(synth){ try{ synth.cancel(); }catch(e){} }
  clearHL(); setListening(false);
}
function readPage(start, once){
  const p = pages[cur];
  if(!synth || p.type !== 'story') return;
  const token = ++speechToken;
  try{ synth.cancel(); }catch(e){}
  const spans = [...document.querySelectorAll('.sent')];
  const texts = p.story.sentences.map(plain);
  let i = start;
  const step = () => {
    if(token !== speechToken) return;
    clearHL();
    if(i >= texts.length){ setListening(false); return; }
    const idx = i;
    if(spans[idx]) spans[idx].classList.add('reading');
    const u = new SpeechSynthesisUtterance(texts[idx]);
    u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.05;
    u.onend = () => {
      if(token !== speechToken) return;
      if(once){ clearHL(); setListening(false); return; }
      i = idx + 1; step();
    };
    u.onerror = () => { if(token !== speechToken) return; clearHL(); setListening(false); };
    synth.speak(u);
  };
  setListening(!once);
  setTimeout(step, 60);
}
function sayWord(text){
  if(!synth) return;
  stopSpeech();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.8;
    synth.speak(u);
  }, 60);
}

/* ----- quiz ----- */
function quizHTML(){
  const n = QUIZ.length;
  if(quiz.done){
    const st = Math.round(quiz.score / n * 5);
    const msg = quiz.score === n ? "Perfect! You remember every detail." : quiz.score >= 5 ? "Great reading! Almost perfect." : quiz.score >= 3 ? "Good try! Read the story once more and try again." : "Keep going! Read the story again and try once more.";
    return `<div class="score"><div class="bigscore">${quiz.score} / ${n}</div>
      <div class="stars" aria-label="${st} out of 5 stars">${'\u2605'.repeat(st)}<span class="off">${'\u2605'.repeat(5-st)}</span></div>
      <p class="lead" style="margin-bottom:18px">${msg}</p>
      <button class="btn" data-act="q-retry">Try the quiz again</button></div>`;
  }
  const q = QUIZ[quiz.i];
  const bar = QUIZ.map((_,i) => `<i class="${i < quiz.i ? 'on' : i === quiz.i ? 'cur' : ''}"></i>`).join('');
  const opts = q.o.map((t,j) => {
    let cls = 'opt', dis = '';
    if(quiz.picked !== null){ dis = 'disabled'; if(j === q.a) cls += ' correct'; else if(j === quiz.picked) cls += ' wrong'; }
    return `<button class="${cls}" data-act="q-pick" data-j="${j}" ${dis}><b>${'ABCD'[j]}</b><span>${t}</span></button>`;
  }).join('');
  let fb = '';
  if(quiz.picked !== null){
    const ok = quiz.picked === q.a;
    fb = `<div class="fb ${ok ? 'ok' : 'no'}" role="status"><strong>${ok ? 'Correct!' : 'Not quite.'}</strong> ${ok ? '' : 'The answer is \u201C' + q.o[q.a] + '\u201D. '}${q.why}</div>
          <button class="btn" data-act="q-next">${quiz.i === n-1 ? 'See my score' : 'Next question'}</button>`;
  }
  return `<div class="qhead"><span>Question ${quiz.i+1} of ${n}</span><span>Score: ${quiz.score}</span></div><div class="qbar">${bar}</div>
    <p class="qtext">${q.q}</p><div class="opts">${opts}</div>${fb}`;
}

/* ----- order game ----- */
function shuffleOrder(){
  const arr = ORDER.map((t,i) => ({t,i}));
  do{
    for(let i = arr.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; }
  }while(arr.every((c,i) => c.i === i));
  order.cards = arr; order.next = 0; order.mistakes = 0; order.placed = {}; order.msg = '';
}
function orderStars(){ return order.mistakes === 0 ? 3 : order.mistakes <= 2 ? 2 : 1; }
function orderHTML(){
  const done = order.next === ORDER.length;
  const cards = order.cards.map(c => {
    const n = order.placed[c.i];
    return `<button class="ocard ${n ? 'placed' : ''}" data-act="o-pick" data-i="${c.i}" ${n ? 'disabled' : ''}><span class="badge">${n || ''}</span><span>${c.t}</span></button>`;
  }).join('');
  const st = orderStars();
  const status = done
    ? `<div class="fb ok" role="status"><strong>Brilliant!</strong> You put the story in order ${order.mistakes === 0 ? 'without a single mistake' : 'after ' + order.mistakes + ' wrong ' + (order.mistakes === 1 ? 'tap' : 'taps')}. <span style="color:var(--marigold)">${'\u2605'.repeat(st)}</span></div>`
    : `<p class="hint" role="status" style="margin:0 0 16px">${order.msg || 'Which sentence happens first?'}</p>`;
  return `<div class="ocards">${cards}</div>${status}<button class="btn ghost" data-act="o-reset">Shuffle again</button>`;
}

  stage.innerHTML = '';
  stage.appendChild(el);
  stage.scrollTop = 0;
  if(p.type === 'end') fillDreamCard();
  updateNav();
}
function go(n){
  n = Math.max(0, Math.min(pages.length-1, n));
  if(n === cur) return;
  const dir = n > cur ? 1 : -1;
  cur = n; render(dir);
}
function updateNav(){
  $('#prev').disabled = cur === 0;
  $('#nextLbl').textContent = cur === pages.length-1 ? 'Start over' : 'Next page';
  $('#next').setAttribute('aria-label', cur === pages.length-1 ? 'Start over' : 'Next page');
  $('#prev').setAttribute('aria-label', 'Previous page');
  $('#progLabel').textContent = 'Page ' + (cur+1) + ' of ' + pages.length;
  $('#progBar').style.width = ((cur+1) / pages.length * 100) + '%';
}

function openToc(){
  $('#tocList').innerHTML = pages.map((p,i) => `<li><button class="ti ${i === cur ? 'cur' : ''}" data-go="${i}"><span class="n">${i+1}</span><span>${p.title}</span></button></li>`).join('');
  toc.classList.add('open');
  const c = $('.ti.cur'); if(c) c.focus();
}
function closeToc(){ toc.classList.remove('open'); }
$('#btnToc').addEventListener('click', openToc);
$('#tocClose').addEventListener('click', closeToc);
toc.addEventListener('click', e => {
  if(e.target === toc){ closeToc(); return; }
  const b = e.target.closest('[data-go]');
  if(b){ closeToc(); go(+b.dataset.go); }
});

/* ----- text size and theme ----- */
const SIZES = [0.9, 1, 1.15, 1.3, 1.5];
let sizeIdx = 1;
function applySize(){ document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]); store('size', sizeIdx); }
$('#btnSm').addEventListener('click', () => { sizeIdx = Math.max(0, sizeIdx-1); applySize(); });
$('#btnLg').addEventListener('click', () => { sizeIdx = Math.min(SIZES.length-1, sizeIdx+1); applySize(); });
function isDark(){
  const t = document.documentElement.dataset.theme;
  if(t) return t === 'dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
$('#btnTheme').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store('theme', next);
});
(function restore(){
  const s = parseInt(load('size'), 10); if(!isNaN(s) && s >= 0 && s < SIZES.length){ sizeIdx = s; applySize(); }
  const t = load('theme'); if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
})();

/* ============================================================
   Interaction
   ============================================================ */
stage.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t){
    const s = e.target.closest('.sent');
    if(s){ closeDef(); readPage(+s.dataset.i, true); return; }
    closeDef(); return;
  }
  const act = t.dataset.act;
  if(act !== 'vocab') closeDef();
  switch(act){
    case 'next': go(cur+1); break;
    case 'toc': openToc(); break;
    case 'vocab': e.stopPropagation(); openDef(t.dataset.k); break;
    case 'listen':
      if(t.getAttribute('aria-pressed') === 'true') stopSpeech(); else readPage(0, false);
      break;
    case 'say': sayWord(VOCAB[t.dataset.k].w); break;
    case 'flip': {
      const on = t.classList.toggle('flipped'); t.setAttribute('aria-pressed', on); break;
    }
    case 'q-pick': {
      if(quiz.picked !== null) break;
      quiz.picked = +t.dataset.j;
      if(quiz.picked === QUIZ[quiz.i].a) quiz.score++;
      $('#quizBox').innerHTML = quizHTML();
      const nb = $('#quizBox [data-act="q-next"]'); if(nb) nb.focus();
      break;
    }
    case 'q-next':
      quiz.picked = null;
      if(quiz.i === QUIZ.length-1) quiz.done = true; else quiz.i++;
      $('#quizBox').innerHTML = quizHTML();
      break;
    case 'q-retry':
      quiz.i = 0; quiz.picked = null; quiz.score = 0; quiz.done = false;
      $('#quizBox').innerHTML = quizHTML();
      break;
    case 'o-pick': {
      const i = +t.dataset.i;
      if(i === order.next){
        order.next++; order.placed[i] = order.next; order.msg = 'Yes! What happens next?';
        $('#orderBox').innerHTML = orderHTML();
      }else{
        order.mistakes++; order.msg = 'Not yet. Think about what happened earlier in the story.';
        $('#orderBox').innerHTML = orderHTML();
        const el = $('#orderBox [data-i="'+i+'"]');
        if(el){ el.classList.add('shake'); el.addEventListener('animationend', () => el.classList.remove('shake'), {once:true}); }
      }
      break;
    }
    case 'o-reset': shuffleOrder(); $('#orderBox').innerHTML = orderHTML(); break;
    case 'goal':
      dream.goal = t.dataset.g;
      document.querySelectorAll('#goals .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.g === dream.goal));
      $('#dGoal').value = ''; fillDreamCard(); break;
    case 'pledge': {
      const i = +t.dataset.i; dream.pledges[i] = !dream.pledges[i];
      t.setAttribute('aria-pressed', dream.pledges[i]); $('#pledgeMsg').textContent = pledgeMsg(); break;
    }
    case 'restart': go(0); break;
  }
});
stage.addEventListener('input', e => {
  if(e.target.id === 'dName'){ dream.name = e.target.value; fillDreamCard(); }
  if(e.target.id === 'dGoal'){
    dream.goal = e.target.value;
    document.querySelectorAll('#goals .chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    fillDreamCard();
  }
});
stage.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('fc')){
    e.preventDefault(); e.target.click();
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeDef(); closeToc(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || toc.classList.contains('open')) return;
  if(e.key === 'ArrowRight') go(cur+1);
  if(e.key === 'ArrowLeft') go(cur-1);
});
let tx = 0, ty = 0;
stage.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, {passive:true});
stage.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if(Math.abs(dx) > 80 && Math.abs(dy) < 45){ dx < 0 ? go(cur+1) : go(cur-1); }
}, {passive:true});
document.addEventListener('visibilitychange', () => { if(document.hidden) stopSpeech(); });

shuffleOrder();
render(1);
</script>
</body>
</html>
